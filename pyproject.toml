[project]
name = "emissor-nf-open"
version = "0.1.0"
description = "Emissor de NFS-e Nacional open source: use seu certificado A1, cadastre modelos e emita pelo painel no seu computador. Feito pela TechZyon."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "TechZyon" }]
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.2",
    "signxml>=4.0",
    "cryptography>=43",
    "requests>=2.32",
    "certifi>=2024.8.30",
    "reportlab>=4.2",
    "flask>=3.0",
    "keyring>=25",
]

[project.urls]
Site = "https://www.techzyon.com.br"
Codigo = "https://github.com/gabrielfonsecabh/EmissordeNFOpen"

[project.scripts]
emissor = "emissor_nf.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["emissor_nf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
